interface:
  display_name: "dbx-plan-convergence"
  short_description: "Explicit standalone plan convergence gate and stall diagnosis"
  default_prompt: "Use $dbx-plan-convergence as a standalone bounded gate for this existing technical plan. Bind every review to the current artifact version, keep providers decoupled, choose one next_action, reuse a matching receipt, and run only one profile-appropriate post-revision verification. That verification closes the correction round: hand decision-owner blockers off and terminally block every other blocker; never start a second revision. Do not claim implementation authority or collection-level trajectory ownership."
policy:
  allow_implicit_invocation: false
